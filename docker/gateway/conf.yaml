# Config for the IBKR gateway container. IBKR's default conf.yaml, with only
# the ips block changed.
#
# Why the allow list is still localhost-only: the container publishes port 5000
# on the host's 127.0.0.1 only (docker-compose.yml), so only local processes can
# connect. Docker's proxy makes every such connection arrive from the bridge
# address 172.31.250.1, so the bridge range must be allowed. A LAN address would
# be denied, which is why 192.* is deliberately not listed. If you change the
# subnet in docker-compose.yml, change the pattern below to match.
ccp: false
proxyRemoteSsl: true
proxyRemoteHost: "https://api.ibkr.com"
listenPort: 5000
listenSsl: true
sslCert: "vertx.jks"
sslPwd: "mywebapi"
authDelay: 3000
portalBaseURL: ""
serverOptions:
  blockedThreadCheckInterval: 1000000
  eventLoopPoolSize: 20
  workerPoolSize: 20
  maxWebsocketFrameSize: 1000000
  maxWebsocketMessageSize: 1000000
cors:
  origin.allowed: "*"
  allowCredentials: false
webApps:
  - name: demo
    index: index.html
ips:
  allow:
    - 127.0.0.1        # the gateway's own healthcheck
    - 172.31.250.*     # docker proxy on the ibkr_gateway bridge (see docker-compose.yml)
  deny:
    - 212.90.324.10    # unchanged from IBKR's default
