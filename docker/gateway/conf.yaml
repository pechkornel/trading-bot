# Config for the IBKR gateway container. This is IBKR's default root/conf.yaml
# from clientportal.gw.zip, with only sslPwd and the ips block changed.
#
# Why the allow list is exactly two addresses: the container publishes port 5000
# on the host's 127.0.0.1 only (docker-compose.yml). Docker's proxy makes every
# such connection arrive from the bridge gateway 172.31.250.1, and the gateway's
# own healthcheck comes from 127.0.0.1. A LAN address would be denied. If you
# change the subnet in docker-compose.yml, change the address below to match.
# sslPwd is a placeholder: entrypoint.sh renders this file into a tmpfs and fills
# it from the gateway_ssl_password secret. The password is never stored here.
ip2loc: "US"
proxyRemoteSsl: true
proxyRemoteHost: "https://api.ibkr.com"
listenPort: 5000
listenSsl: true
ccp: false
svcEnvironment: "v1"
sslCert: "vertx.jks"
sslPwd: "__SSL_PWD__"
authDelay: 3000
portalBaseURL: ""
serverOptions:
  blockedThreadCheckInterval: 1000000
  eventLoopPoolSize: 20
  workerPoolSize: 20
  maxWorkerExecuteTime: 100
  internalBlockingPoolSize: 20
cors:
  origin.allowed: "*"
  allowCredentials: false
webApps:
  - name: "demo"
    index: "index.html"
ips:
  allow:
    - 127.0.0.1        # the gateway's own healthcheck
    - 172.31.250.1     # docker proxy on the ibkr_gateway bridge (see docker-compose.yml)
  deny:
    - 212.90.324.10    # unchanged from IBKR's default
