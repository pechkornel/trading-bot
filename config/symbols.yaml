# Phase 8 — medium-to-long-term portfolio.
#
# Three sleeves now (one disabled):
#
#   core        — 70% of equity. Weekly score-based asset allocation across
#                 10 ETFs. Composite score = 40% momentum + 30% macro
#                 alignment + 30% trend. Holds top 4 equal-weighted. Hard
#                 risk-off filter to bonds when SPY < 200d MA AND VIX > 25.
#                 Typical hold: weeks to months.
#
#   sentiment   : RESEARCH, 0% of equity, off. Alpha-Vantage-news-driven satellite
#                 (Phase 8B). Alpha Vantage NEWS_SENTIMENT is now a premium
#                 endpoint, so the sleeve stays out of the portfolio until a
#                 working data source exists. Rules when active: longs only on
#                 bullish sentiment spikes (|score| > 0.4 with >=5 articles),
#                 10-day hard exit or 5% stop, max 4 concurrent, 5% of sleeve
#                 each. The 20% it used to hold stays unallocated (cash), so 30% of
#                 equity in total is now unallocated.
#
#   tactical    — DISABLED. The 5-min XGBoost code stays in place; flip
#                 `enabled: true` to bring it back.

universe:
  # ---- Core sleeve universe (10 ETFs: 4 equity, 3 bonds, 2 alts, 1 cash) ----
  SPY:                                   # US large cap
    bar_size: "1 day"
    history_duration: "2 Y"
    timeframe_label: "daily"
    model: SPY_5min_xgboost              # legacy, only used if tactical re-enabled
  IWM:                                   # US small cap
    bar_size: "1 day"
    history_duration: "2 Y"
    timeframe_label: "daily"
  EFA:                                   # Developed international (EAFE)
    bar_size: "1 day"
    history_duration: "2 Y"
    timeframe_label: "daily"
  VWO:                                   # Emerging markets
    bar_size: "1 day"
    history_duration: "2 Y"
    timeframe_label: "daily"
  TLT:                                   # 20+ year Treasury bonds
    bar_size: "1 day"
    history_duration: "2 Y"
    timeframe_label: "daily"
  IEF:                                   # 7-10 year Treasury bonds
    bar_size: "1 day"
    history_duration: "2 Y"
    timeframe_label: "daily"
  AGG:                                   # Aggregate bond
    bar_size: "1 day"
    history_duration: "2 Y"
    timeframe_label: "daily"
  GLD:                                   # Gold
    bar_size: "1 day"
    history_duration: "2 Y"
    timeframe_label: "daily"
    model: GLD_5min_xgboost              # legacy
  DBC:                                   # Diversified commodities
    bar_size: "1 day"
    history_duration: "2 Y"
    timeframe_label: "daily"
  BIL:                                   # 1-3 month T-bills (cash proxy)
    bar_size: "1 day"
    history_duration: "2 Y"
    timeframe_label: "daily"

  # ---- Sentiment satellite universe (high-news-flow tickers) ----
  QQQ:
    bar_size: "1 day"
    history_duration: "2 Y"
    timeframe_label: "daily"
    model: QQQ_5min_xgboost              # legacy
  AAPL:
    bar_size: "1 day"
    history_duration: "2 Y"
    timeframe_label: "daily"
    model: AAPL_5min_xgboost             # legacy
  MSFT:
    bar_size: "1 day"
    history_duration: "2 Y"
    timeframe_label: "daily"
  NVDA:
    bar_size: "1 day"
    history_duration: "2 Y"
    timeframe_label: "daily"
  TSLA:
    bar_size: "1 day"
    history_duration: "2 Y"
    timeframe_label: "daily"
  AMZN:
    bar_size: "1 day"
    history_duration: "2 Y"
    timeframe_label: "daily"
  META:
    bar_size: "1 day"
    history_duration: "2 Y"
    timeframe_label: "daily"
  GOOGL:
    bar_size: "1 day"
    history_duration: "2 Y"
    timeframe_label: "daily"

portfolio:
  starting_equity: 100000.0              # last-resort total equity when the paper account value is unavailable or rejected
                                         # and there is no recent gateway reading, and the anchor of the range check below
  use_account_equity: true               # size sleeves from the paper account's net liquidation; false = always starting_equity
                                         # (must be a YAML boolean: a quoted "false" is rejected at load)
  equity_min_ratio: 0.25                 # reject a net liquidation below this multiple of starting_equity
  equity_max_ratio: 2.0                  # reject a net liquidation above this multiple of starting_equity
                                         # (a 1,000,000 paper account needs starting_equity: 1000000)
  equity_max_step: 0.25                  # reject a reading that differs by more than this fraction (25%) from the last
                                         # accepted gateway reading (only checked while that reading is younger than the max age)
  equity_last_max_age_sec: 86400         # after a failed or rejected read, reuse the last accepted gateway reading if it is
                                         # younger than this (one day); otherwise fall back to starting_equity
  equity_currency: "USD"                 # expected 3 letter currency of the account value (a missing currency is accepted)
  cycle_interval_sec: 3600               # one decision cycle per hour
                                         # (core acts at most once per US Eastern day:
                                         #  on Friday or on drift;
                                         #  sentiment satellite acts daily;
                                         #  most cycles will be no-ops)
  reentry_cooldown_sec: 86400            # min seconds between selling a symbol to 0 and buying it back, per sleeve

sleeves:
  core:
    enabled: true
    allocation_pct: 0.70
    # Universe used for ranking (must be a subset of `universe` above)
    universe: [SPY, IWM, EFA, VWO, TLT, IEF, AGG, GLD, DBC, BIL]
    # How many top-scored assets to hold each rebalance
    hold_top_n: 4
    # Score weights (must sum to 1.0)
    momentum_weight: 0.40
    macro_weight: 0.30
    trend_weight: 0.30
    # Momentum lookback in trading days
    momentum_lookback_days: 252          # ~12 months
    # Trend filter — price vs 200-day MA
    trend_ma_days: 200
    # Hard risk-off filter
    risk_off_spy_ma_days: 200
    risk_off_vix_threshold: 25.0
    risk_off_universe: [TLT, IEF]        # what to hold when risk-off triggers
    # Rebalance triggers
    rebalance_day_of_week: 4             # 0=Mon, 4=Fri (US Eastern weekday)
    drift_threshold: 0.08                # rebalance if any holding drifts >8%

  sentiment:
    enabled: false                       # off: Alpha Vantage NEWS_SENTIMENT is premium now
    allocation_pct: 0.0                  # research status requires 0
    status: research                     # active | research
    universe: [SPY, QQQ, AAPL, MSFT, NVDA, TSLA, AMZN, META, GOOGL]
    # Entry rules
    sentiment_threshold: 0.4             # |score| must exceed
    min_article_count: 5
    max_concurrent_positions: 4
    position_pct_of_sleeve: 0.05         # each position is 5% of sleeve equity
    # Exit rules
    hold_max_days: 10                    # hard exit after N NYSE trading days (session closes after entry)
    stop_loss_pct: 0.05                  # 5% stop
    # Direction
    longs_only: true                     # no shorts

  tactical:
    enabled: false                       # the 5-min XGBoost sleeve, disabled
    allocation_pct: 0.0
    universe: [SPY, AAPL, QQQ, GLD]
    ta_weight: 0.70
    sentiment_weight: 0.30
    target_vol_per_bar: 0.005
    vol_lookback: 20
    max_per_symbol_pct: 0.40
    max_gross_pct: 1.0
    confidence_floor: 0.55

# Macro data feeds for the core sleeve scoring
macro:
  # FRED series IDs (free, no auth) — https://fred.stlouisfed.org/
  fred_series:
    yield_curve: T10Y2Y                  # 10Y - 2Y Treasury spread, %
    fed_funds: DFF                       # Federal Funds Effective Rate, %
    ten_year: DGS10                      # 10Y Treasury yield, %
    two_year: DGS2                       # 2Y Treasury yield, %
    cpi: CPIAUCSL                        # CPI All Urban (monthly, NSA)
    unemployment: UNRATE                 # Unemployment Rate (monthly)
  # yfinance tickers for things FRED doesn't carry
  yf_tickers:
    vix: "^VIX"
    dxy: "DX-Y.NYB"
    hyg: "HYG"                           # high-yield credit
    lqd: "LQD"                           # investment-grade credit
  cache_ttl_sec: 21600                   # 6h — macro doesn't change fast

# Sentiment provider settings (Alpha Vantage News & Sentiment API)
sentiment_provider:
  provider: alpha_vantage
  poll_interval_sec: 3600
  staleness_sec: 86400                   # 24h — daily-cadence trading
  symbols: [SPY, QQQ, AAPL, MSFT, NVDA, TSLA, AMZN, META, GOOGL]

# Session keeper (live/cpgw_keeper.py). Times are 24 hour "HH:MM" strings and must be
# quoted: YAML reads an unquoted 10:30 as a number and the loader rejects it.
keeper:
  tickle_interval_sec: 60                # POST /tickle cadence that keeps the gateway session alive
  timezone: "America/New_York"           # zone for the windows below (handles daylight saving)
  nightly_gap_start: "00:45"             # IBKR resets /iserver around 01:00: no fresh login inside this window
  nightly_gap_end: "01:30"
  maintenance_weekday: 5                 # 0=Mon ... 5=Sat: the weekly maintenance day, no fresh login inside the window
  maintenance_start: "00:00"             # Saturday maintenance runs all day (start must be before end, no midnight wrap)
  maintenance_end: "23:59"
  max_session_age_sec: 86400             # a drop after this age is the expected 24 hour reset
  login_backoff_base_sec: 60             # unexpected drops retry after 60, 120, 240 ... seconds
  login_backoff_max_sec: 1800            # ... capped at 30 minutes
  max_failed_logins: 3                   # submitted login attempts allowed per window before a lockout
  failed_login_window_sec: 86400         # the lockout window (24 hours)
  session_lost_alert_cooldown_sec: 3600  # at most one session-lost alert per hour
  paper_account_prefix: "DU"             # every account id after login must start with this, or the keeper logs out and locks
  max_logins_per_window: 6               # total submitted logins per window, even successful ones; the cap locks the keeper until it rolls off or --reset-lockout
  min_session_sec: 600                   # a session that lasted less than this (10 minutes) makes the next drop back off 60, 120, 240 ... seconds
  cookieless_401_means_logged_out: true   # true: a cookie-less 401 from auth/status means nobody is logged in. Set false if the gateway answers 401 to a cookie-less request while you are logged in (deploy/README.md 0B step 13 check); then a 401 counts as unsure and the keeper never submits on it
