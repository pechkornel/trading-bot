# Compose file for the home server.
#
# What runs:
#   - `dashboard`     - always on, FastAPI on host port 8765
#                       (bound to DASHBOARD_HOST, default 127.0.0.1)
#   - `cpgw_keeper`   - auto profile; headless gateway login + /tickle keepalive
#                       (own image target `keeper`, holds the login secret)
#   - `portfolio`     - auto profile; multi-sleeve runner, depends on the keeper
#   - `sentiment`     - research profile (normally off); news/sentiment poller
#   - `ibkr_gateway`  - gateway profile; IBKR Client Portal Gateway (pinned native
#                       executable) on its own bridge network, published on
#                       127.0.0.1:5000 only
#
# Usage:
#   docker compose up -d                       # dashboard only
#   docker compose --profile auto up -d        # dashboard + keeper + portfolio
#   docker compose --profile research up -d    # adds the sentiment poller
#   docker compose --profile gateway up -d     # the gateway container only
#
# CPGW (Client Portal Gateway) can run here (profile `gateway`) or on the HOST as
# a separate service (IBKR's Java daemon on port 5000). Use one or the other, both
# want port 5000. `network_mode: host` lets the bot containers reach
# https://localhost:5000 either way.
#
# Required in .env:
#   PAPER=true                     - assert_paper_mode refuses anything else
#   IB_PORT=5000                   - CPGW only ever uses 5000
#
# The IBKR login is NOT in .env. It is the file ./secrets/ibkr_login (mode 600),
# mounted as a Compose secret into cpgw_keeper only.
#
# Memory: every service has mem_limit equal to memswap_limit (no swap). Normal
# total (dashboard, keeper, portfolio, gateway) is 2560m; with `research` 2816m.

x-bot-common: &bot-common
  build:
    context: .
    dockerfile: docker/Dockerfile
    target: app
  image: tradingbot:local
  restart: unless-stopped
  network_mode: host
  env_file:
    - .env
  volumes:
    - ./logs:/app/logs
    - ./models/artifacts:/app/models/artifacts
    - ./config:/app/config:ro
    - ./.env:/app/.env:ro

services:
  dashboard:
    <<: *bot-common
    container_name: tradingbot-dashboard
    mem_limit: 512m
    memswap_limit: 512m
    command:
      - uvicorn
      - dashboard.app:app
      - --host
      - ${DASHBOARD_HOST:-127.0.0.1}
      - --port
      - "8765"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8765/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  cpgw_keeper:
    <<: *bot-common
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: keeper
    image: tradingbot-keeper:local
    container_name: tradingbot-cpgw-keeper
    profiles: ["auto"]
    mem_limit: 640m
    memswap_limit: 640m
    command:
      - python
      - -m
      - live.cpgw_keeper
    # Logs into the gateway headlessly and keeps the session alive.
    # The login comes from the Compose secret ibkr_login (/run/secrets/ibkr_login).
    # core/secret_store.py requires that file to be mode 600 and owned by the
    # reading uid. A Compose file secret keeps the owner and mode of the host
    # file, so the container user is pinned to uid 1000 (the `bot` user in
    # docker/Dockerfile) and secrets/ibkr_login must be owned by uid 1000 on the
    # host: chown 1000:1000 secrets/ibkr_login && chmod 600 secrets/ibkr_login.
    user: "1000:1000"
    secrets:
      - ibkr_login
    volumes:
      - ./logs:/app/logs
      - ./models/artifacts:/app/models/artifacts
      - ./config:/app/config:ro
      - ./.env:/app/.env:ro
      - ibkr_gateway_tls:/app/gateway_tls:ro
    environment:
      - CPGW_CA_FILE=/app/gateway_tls/cert.pem
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      dashboard:
        condition: service_healthy

  portfolio:
    <<: *bot-common
    container_name: tradingbot-portfolio
    profiles: ["auto"]
    mem_limit: 640m
    memswap_limit: 640m
    command:
      - python
      - -m
      - live.portfolio_runner
      # Dry run by default. Sending paper orders is a deliberate, separate edit
      # of this command (see CLAUDE.md), never part of the shipped file.
    volumes:
      - ./logs:/app/logs
      - ./models/artifacts:/app/models/artifacts
      - ./config:/app/config:ro
      - ./.env:/app/.env:ro
      - ibkr_gateway_tls:/app/gateway_tls:ro
    environment:
      - CPGW_CA_FILE=/app/gateway_tls/cert.pem
    depends_on:
      dashboard:
        condition: service_healthy
      cpgw_keeper:
        condition: service_started

  sentiment:
    <<: *bot-common
    container_name: tradingbot-sentiment
    profiles: ["research"]
    mem_limit: 256m
    memswap_limit: 256m
    command:
      - python
      - -m
      - live.sentiment_worker
    # Needs ALPHA_VANTAGE_API_KEY in .env unless config/symbols.yaml uses stub.
    depends_on:
      dashboard:
        condition: service_healthy

  ibkr_gateway:
    build:
      context: docker/gateway
      # Run scripts/fetch_gateway.sh first: it puts the pinned zip here.
      additional_contexts:
        vendor: ./vendor/ibkr-gateway
    image: tradingbot-ibkr-gateway:v1.0.0
    container_name: tradingbot-ibkr-gateway
    profiles: ["gateway"]
    mem_limit: 768m
    memswap_limit: 768m
    restart: unless-stopped
    networks: [ibkr_gateway]
    ports:
      - "127.0.0.1:5000:5000"   # loopback only, never "5000:5000"
    secrets:
      - gateway_ssl_password
    tmpfs:
      - /opt/ibkr-gateway/run:uid=10001,gid=10001,mode=0700,size=1m
    volumes:
      - ./docker/gateway/conf.yaml:/opt/ibkr-gateway/conf.template.yaml:ro
      - ibkr_gateway_tls:/opt/ibkr-gateway/tls
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

networks:
  ibkr_gateway:
    ipam:
      config:
        - subnet: 172.31.250.0/24

volumes:
  ibkr_gateway_tls:

secrets:
  gateway_ssl_password:
    file: ./secrets/gateway_ssl_password
  ibkr_login:
    file: ./secrets/ibkr_login
